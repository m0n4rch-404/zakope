
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakope — Admin panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #0b1020;
      color: #edf2ff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 760px; margin: auto; }
    h1 { color: #8ab4ff; }
    .panel {
      background: #151d32;
      padding: 22px;
      margin: 18px 0;
      border-radius: 14px;
      border: 1px solid #2c3955;
    }
    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font: inherit;
    }
    input, textarea {
      background: #0b1020;
      color: white;
      border: 1px solid #405070;
    }
    textarea { min-height: 150px; resize: vertical; }
    button {
      background: #3978f6;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .secondary { background: #34425f; }
    .article {
      padding: 14px 0;
      border-bottom: 1px solid #34425f;
      overflow-wrap: anywhere;
    }
    .muted { color: #aab7d0; font-size: 14px; }
    #status { white-space: pre-wrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Zakope Admin</h1>
  <p class="muted">Faktlar bazasini boshqarish paneli</p>

  <section class="panel" id="loginPanel">
    <h2>Admin hisobiga kirish</h2>
    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Email manziling" required autocomplete="username">
      <input id="password" type="password"
        placeholder="Paroling" required autocomplete="current-password">
      <button id="loginButton" type="submit">Kirish</button>
    </form>
  </section>

  <section class="panel" id="adminPanel" hidden>
    <p id="signedIn" class="muted"></p>
    <button id="logoutButton" class="secondary" type="button">
      Chiqish
    </button>

    <h2>Yangi fakt qo‘shish</h2>
    <form id="articleForm">
      <input id="title" maxlength="200"
        placeholder="Fakt sarlavhasi" required>
      <input id="category" maxlength="100"
        placeholder="Kategoriya (masalan: Tarix)" required>
      <textarea id="content"
        placeholder="Fakt haqida to‘liq ma’lumot..." required></textarea>
      <button id="saveButton" type="submit">Bazaga saqlash</button>
    </form>

    <h2>Saqlangan faktlar</h2>
    <div id="articles">Yuklanmoqda...</div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://yckayzhiutrvkmecjpbh.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DiMeLr_LlNPJ3x9eaYcjtQ_s0Fdx-RS";

  const ADMIN_UID = "9b294cbc-3f9b-4d8c-b570-0dfcfc69a09e";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const $ = id => document.getElementById(id);
  let busy = false;

  function status(message) {
    $("status").textContent = message;
  }

  function showSession(session) {
    const isAdmin = session?.user?.id === ADMIN_UID;
    $("loginPanel").hidden = !!session;
    $("adminPanel").hidden = !isAdmin;

    if (session && !isAdmin) {
      status("Bu hisob admin emas. Admin hisobing bilan kir.");
    } else if (isAdmin) {
      $("signedIn").textContent =
        "Tizimga kirding: " + session.user.email;
      status("");
      loadArticles();
    }
  }

  async function loadArticles() {
    $("articles").textContent = "Yuklanmoqda...";

    const { data, error } = await client
      .from("articles")
      .select("id, title, category, content, created_at")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {
      $("articles").textContent = "Xatolik: " + error.message;
      return;
    }

    $("articles").replaceChildren();

    if (!data.length) {
      $("articles").textContent = "Hozircha faktlar yo‘q.";
      return;
    }

    for (const article of data) {
      const item = document.createElement("div");
      item.className = "article";

      const title = document.createElement("h3");
      title.textContent = article.title;

      const category = document.createElement("p");
      category.className = "muted";
      category.textContent = article.category || "Umumiy";

      const content = document.createElement("p");
      content.textContent = article.content;

      item.append(title, category, content);
      $("articles").append(item);
    }
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;
    busy = true;
    $("loginButton").disabled = true;
    status("Tekshirilmoqda...");

    try {
      const { data, error } = await client.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) throw error;
      showSession(data.session);
    } catch (error) {
      status("Kirish amalga oshmadi: " + error.message);
    } finally {
      busy = false;
      $("loginButton").disabled = false;
    }
  });

  $("articleForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;

    const { data: sessionData } = await client.auth.getSession();
    if (sessionData.session?.user?.id !== ADMIN_UID) {
      status("Admin hisobiga qayta kir.");
      return;
    }

    busy = true;
    $("saveButton").disabled = true;
    status("Ma’lumot saqlanmoqda...");

    try {
      const { error } = await client.from("articles").insert({
        title: $("title").value.trim(),
        category: $("category").value.trim() || "Umumiy",
        content: $("content").value.trim()
      });

      if (error) throw error;

      $("articleForm").reset();
      status("Fakt muvaffaqiyatli saqlandi!");
      await loadArticles();
    } catch (error) {
      status("Saqlashda xatolik: " + error.message);
    } finally {
      busy = false;
      $("saveButton").disabled = false;
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    if (error) {
      status("Chiqishda xatolik: " + error.message);
      return;
    }
    showSession(null);
    status("Hisobdan chiqding.");
  });

  client.auth.onAuthStateChange((_event, session) => {
    showSession(session);
  });

  client.auth.getSession().then(({ data, error }) => {
    if (error) {
      status("Sessiyani tekshirishda xatolik: " + error.message);
      return;
    }
    showSession(data.session);
  });
})();
</script>
</body>
</html>
